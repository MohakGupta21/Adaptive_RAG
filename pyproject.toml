[project]
name = "langgraph-05"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohak.gupta", email = "mohak.gupta@whilter.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.14",
    "pypdfium2>=5.6.0,<5.12",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.25",
]

[project.scripts]
langgraph-05 = "langgraph_05:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# This Mac runs macOS 12; cap packages whose newer wheels require macOS 13/14+.
constraint-dependencies = [
    "onnxruntime<1.20; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
